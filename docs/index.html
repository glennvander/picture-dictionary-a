<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture Dictionary: A to Z</title>
<style>
:root{
  --navy:#1338BE; --orange:#FF6831; --ink:#242424; --slate:#636363;
  --wash:#EAF0F6; --line:#D6DFE9; --paper:#fdfdfe;
  --snap: 620ms;
  --ease: cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% -10%,#f7fafd 0%,#dfe7f1 55%,#cdd8e6 100%);
  display:flex;flex-direction:column;align-items:center;padding:22px 16px 16px;
  overflow:hidden;-webkit-user-select:none;user-select:none;
}

.masthead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:21px;
  box-shadow:0 3px 10px rgba(19,56,190,.3)}
.masthead h1{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.2px}
.masthead p{font-size:12px;color:var(--slate);margin-top:1px}

.stage{flex:1;display:grid;place-items:center;width:100%}
.book{position:relative;transition:transform var(--snap) var(--ease)}

/* resting pages -------------------------------------------------------- */
.pane{position:absolute;top:0;height:100%;overflow:hidden;background:var(--paper)}
.pane img{width:100%;height:100%;object-fit:contain;display:block;background:var(--paper)}
.pane.left{left:0}
.pane.right{right:0}
.book.single .pane{width:100%!important;left:0;right:auto}

/* the sheet revealed beneath the one being turned */
.under{z-index:1}
.rest{z-index:2}

.blockshadow{
  position:absolute;top:0;height:100%;border-radius:3px;background:var(--paper);
  box-shadow:0 26px 60px -18px rgba(18,32,60,.45),0 5px 16px rgba(18,32,60,.16),
             0 2px 0 -1px #f2f5f9,0 4px 0 -2px #e7ecf3,0 6px 0 -3px #dbe3ec;
  pointer-events:none;z-index:0;transition:left var(--snap) var(--ease),width var(--snap) var(--ease);
}
.book::after{
  content:"";position:absolute;left:50%;top:2%;height:96%;width:46px;
  transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(20,30,50,.14) 47%,
             rgba(20,30,50,.19) 50%,rgba(20,30,50,.14) 53%,rgba(0,0,0,0));
  opacity:0;transition:opacity 380ms ease;
}
.book.opened::after{opacity:1}
.book.single::after{display:none}

/* the sheet in motion --------------------------------------------------- */
.turner{position:absolute;top:0;height:100%;z-index:9;pointer-events:none;
  transform-origin:50% 50%}
.turner .layer{position:absolute;inset:0;overflow:hidden}
.turner img{width:100%;height:100%;object-fit:contain;display:block;background:var(--paper)}

/* the part still lying flat on the book */
.turner .flat{z-index:1}
/* the folded-over part: shows the reverse of the sheet, hence the mirror */
.turner .flap{z-index:2;filter:drop-shadow(0 3px 14px rgba(14,24,44,.42))}
.turner .flap .mirror,.turner .flat .mirror{position:absolute;inset:0}
/* The fold matrices are derived in absolute page coordinates, so they must be
   applied from the sheet's top-left. The CSS default of 50% 50% would offset
   every reflection by half the page and throw the flap off the sheet. */
.turner .flap,.turner .cast,.turner .flap .mirror,.turner .flat .mirror{transform-origin:0 0}
/* paper is not perfectly opaque or perfectly lit: the flap darkens toward
   the crease, which is what actually sells the fold */
.turner .flap .sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--sheen-angle,0deg),
    rgba(12,20,38,.22) 0%, rgba(12,20,38,.06) 20%, rgba(255,255,255,.14) 55%,
    rgba(255,255,255,.04) 100%)}
/* shadow the lifted flap throws onto whatever it is passing over */
.turner .cast{z-index:0;background:rgba(10,18,34,.22);filter:blur(9px)}
/* an unprinted sheet back should read as paper, not as a grey card */
.turner .flap .mirror{background:var(--paper)}

/* corner affordance ------------------------------------------------------ */
.corner{position:absolute;width:17%;height:24%;z-index:12;cursor:grab;
  background:transparent;border:0;padding:0;touch-action:none}
.corner:active{cursor:grabbing}
.corner:focus-visible{outline:3px solid var(--orange);outline-offset:-3px;border-radius:4px}
.corner.n-next{top:0;right:0}   .corner.s-next{bottom:0;right:0}
.corner.n-prev{top:0;left:0}    .corner.s-prev{bottom:0;left:0}
.corner .peel{position:absolute;width:0;height:0;transition:all 240ms ease;pointer-events:none;
  filter:drop-shadow(-3px 3px 5px rgba(20,35,60,.32))}
.corner.n-next .peel{top:0;right:0;border-top:0 solid rgba(255,255,255,.97);border-left:0 solid transparent}
.corner.s-next .peel{bottom:0;right:0;border-bottom:0 solid rgba(255,255,255,.97);border-left:0 solid transparent}
.corner.n-prev .peel{top:0;left:0;border-top:0 solid rgba(255,255,255,.97);border-right:0 solid transparent}
.corner.s-prev .peel{bottom:0;left:0;border-bottom:0 solid rgba(255,255,255,.97);border-right:0 solid transparent}
.corner:hover .peel{border-width:46px}
.corner[disabled]{cursor:default}
.corner[disabled] .peel{display:none}

/* controls --------------------------------------------------------------- */
.controls{display:flex;align-items:center;gap:16px;margin-top:16px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);padding:8px 14px;border-radius:999px;
  box-shadow:0 6px 22px rgba(18,32,60,.13)}
.controls button{border:0;background:var(--navy);color:#fff;font:inherit;font-size:14px;
  font-weight:700;width:34px;height:34px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;transition:transform 140ms ease,opacity 140ms ease}
.controls button:hover:not(:disabled){transform:scale(1.09)}
.controls button:disabled{opacity:.28;cursor:default}
.controls button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.readout{font-size:13px;color:var(--slate);min-width:140px;text-align:center;font-weight:600}
.readout b{color:var(--navy)}
.rail{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:12px;
  max-width:900px}
.rail button.home{width:auto;padding:0 11px;background:var(--navy);color:#fff;
  margin-right:7px}
.rail button.home:hover{background:var(--orange)}
.rail button{width:25px;height:25px;border:0;border-radius:6px;cursor:pointer;
  background:rgba(255,255,255,.72);color:var(--navy);font:inherit;font-size:11px;
  font-weight:700;transition:background 120ms ease,transform 120ms ease}
.rail button:hover{background:var(--navy);color:#fff;transform:translateY(-1px)}
.rail button[aria-current="true"]{background:var(--navy);color:#fff}
.rail button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

/* brief confirmation of a jump — a letter press moves many pages at once, so
   without feedback it is not obvious anything happened */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:700;
  padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity 180ms ease,transform 180ms ease;z-index:50;
  box-shadow:0 8px 24px rgba(18,32,60,.28)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.tip{font-size:12px;color:var(--slate);margin-top:9px;text-align:center}
.tip kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font:inherit;font-size:11px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){:root{--snap:1ms}}
</style>
</head>
<body>

<header class="masthead">
  <div class="mark" aria-hidden="true">A</div>
  <div>
    <h1>Picture Dictionary — A to Z</h1>
  </div>
</header>

<div class="stage">
  <div class="book" id="book" aria-label="Picture dictionary flipbook"></div>
</div>

<div class="controls">
  <button id="prev" aria-label="Previous page">&#10094;</button>
  <span class="readout" id="readout"></span>
  <button id="next" aria-label="Next page">&#10095;</button>
</div>
<nav class="rail" id="rail" aria-label="Jump to a letter"></nav>
<p class="tip">Drag a page corner to peel it · <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to turn ·
   press a <kbd>letter</kbd> to jump · <kbd>Esc</kbd> for the cover</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="peel.js"></script>
<script>
const { foldGeometry } = Peel;

const PAGES = 46;
// Generated by make_site.py from the built book — letter -> page indices.
const LETTER_PAGES = {A:[1],B:[2,3],C:[4,5],D:[6,7],E:[8],F:[9,10],G:[11,12],H:[13,14],I:[15],J:[16],K:[17],L:[18,19],M:[20,21],N:[22],O:[23],P:[24,25],Q:[26],R:[27,28],S:[29,30,31],T:[32,33],U:[34],V:[35],W:[36,37],X:[38],Y:[39],Z:[40]};
const SPREAD_MIN = 820;
const src = i => (i >= 0 && i < PAGES) ? `pages/p${String(i).padStart(2,'0')}.jpg` : '';

const book = document.getElementById('book');
const readout = document.getElementById('readout');
let mode = '', idx = 0, W = 0, H = 0, paneW = 0, busy = false;

const LAST = () => mode === 'spread' ? Math.ceil(PAGES/2) : PAGES - 1;
const leftPage  = () => mode === 'spread' ? idx*2 - 1 : idx;
const rightPage = () => mode === 'spread' ? idx*2     : idx;

/* Which page lies on the part still flat, and which is revealed on the folded
   flap. Turning forward, the sheet is face-up: flat shows its front, the flap
   reveals its back. Turning BACK, that same sheet is already flipped and lying
   face-down on the left, so the flat part shows its back and the flap reveals
   its front — the two swap. */
function sheetPages(dir){
  if (mode === 'single')
    return dir > 0 ? { flat: idx,      flap: -1 }
                   : { flat: -1,       flap: idx-1 };
  return dir > 0 ? { flat: idx*2,   flap: idx*2+1 }
                 : { flat: idx*2-1, flap: idx*2-2 };
}
const underPage = dir => mode === 'single'
  ? (dir > 0 ? idx+1 : idx)
  : (dir > 0 ? idx*2+2 : idx*2-3);

/* ---------------------------------------------------------------- skeleton
   The DOM is built once. Re-rendering only swaps src attributes and styles —
   tearing down and recreating <img> elements on every render (including the
   resize that fires at startup) leaves fresh images unpainted, and forces a
   re-decode of every page each time the window moves. */
const el = (t,c) => { const e=document.createElement(t); if(c) e.className=c; return e; };

function makePane(cls){
  const d = el('div','pane '+cls);
  const i = el('img'); i.draggable = false; i.alt = '';
  d.appendChild(i);
  return d;
}
function setPage(paneEl, page){
  const img = paneEl.querySelector('img');
  const s = src(page);
  // A pane with no page behind it must vanish entirely. Hiding only the <img>
  // leaves the pane painting --paper, which shows up as a blank white sheet
  // beside the front and back covers.
  paneEl.style.display = s ? '' : 'none';
  if (s){
    if (img.getAttribute('src') !== s){ img.src = s; }
    img.alt = `Page ${page+1}`;
    img.style.display = '';
  }
}

let shadowEl, paneL, paneR, underEl, turnerEl, corners = [];

function buildSkeleton(){
  book.innerHTML = '';
  corners = [];

  shadowEl = el('div','blockshadow');
  underEl  = makePane('under');
  paneL    = makePane('left rest');
  paneR    = makePane('right rest');

  turnerEl = el('div','turner');
  const cast = el('div','layer cast');
  const flat = el('div','layer flat');
  const fmir = el('div','mirror');
  fmir.appendChild(Object.assign(el('img'), {draggable:false, alt:''}));
  flat.appendChild(fmir);
  const flap = el('div','layer flap');
  const mir  = el('div','mirror');
  mir.appendChild(Object.assign(el('img'), {draggable:false, alt:''}));
  flap.append(mir, el('div','sheen'));
  turnerEl.append(cast, flat, flap);
  turnerEl.style.display = 'none';
  // The reveal pane is only ever wanted mid-turn. Left visible at load it
  // paints --paper in whichever slot has no page, which is exactly the blank
  // sheet that appears beside the front cover.
  underEl.style.display = 'none';

  book.append(shadowEl, underEl, paneL, paneR, turnerEl);

  for (const [cls, dir, edge] of [['n-next',1,'top'],['s-next',1,'bottom'],
                                  ['n-prev',-1,'top'],['s-prev',-1,'bottom']]){
    const b = el('button','corner '+cls);
    b.appendChild(el('span','peel'));
    b.setAttribute('aria-label', dir>0 ? 'Turn to next page' : 'Turn back a page');
    b.dataset.dir = dir; b.dataset.edge = edge;
    b.addEventListener('pointerdown', onGrab);
    b.addEventListener('click', e => { if(!dragged){ e.preventDefault(); go(dir); } });
    book.appendChild(b);
    corners.push(b);
  }
}

/* ------------------------------------------------------------------ render */
function render(){
  const spread = mode === 'spread';
  paneL.style.width = '50%';
  paneR.style.width = spread ? '50%' : '100%';
  underEl.style.width = spread ? '50%' : '100%';

  setPage(paneL, spread ? leftPage() : -1);
  setPage(paneR, rightPage());

  if (spread){
    if (idx === 0)          { shadowEl.style.left='50%'; shadowEl.style.width='50%'; }
    else if (idx === LAST()){ shadowEl.style.left='0%';  shadowEl.style.width='50%'; }
    else                    { shadowEl.style.left='0%';  shadowEl.style.width='100%'; }
    // Only one leaf is showing at the covers, so shift the block to keep it
    // centred instead of hanging off one side of an empty half.
    book.style.transform = idx === 0 ? 'translateX(-25%)'
                         : idx === LAST() ? 'translateX(25%)' : 'none';
    book.classList.toggle('opened', idx > 0 && idx < LAST());
  } else {
    shadowEl.style.left='0%'; shadowEl.style.width='100%';
    book.style.transform = 'none';
    book.classList.remove('opened');
  }

  for (const b of corners)
    b.disabled = (+b.dataset.dir > 0) ? idx >= LAST() : idx <= 0;

  if (spread){
    readout.innerHTML = idx===0 ? '<b>Front cover</b>'
      : idx===LAST() ? '<b>Back cover</b>'
      : `Pages <b>${idx*2}</b>–<b>${idx*2+1}</b> of ${PAGES}`;
  } else {
    readout.innerHTML = idx===0 ? '<b>Front cover</b>'
      : idx>=PAGES-1 ? '<b>Back cover</b>'
      : `Page <b>${idx+1}</b> of ${PAGES}`;
  }
  document.getElementById('prev').disabled = idx <= 0;
  document.getElementById('next').disabled = idx >= LAST();
}

/* -------------------------------------------------------------------- peel */
let geo=null, curDir=0, curEdge='top', dragged=false;
let animToken = 0;   // bumped to abandon an in-flight turn

function armTurner(dir, edge){
  curDir = dir; curEdge = edge;
  const {flat: flatPage, flap: flapPage} = sheetPages(dir);

  turnerEl.style.display = '';
  turnerEl.style.width = paneW+'px';
  turnerEl.style.left = (mode==='spread' && dir>0) ? paneW+'px' : '0px';
  // a backward turn is the mirror of a forward one, so flip the rig and reuse
  // one set of geometry instead of writing it twice
  turnerEl.style.transform = dir<0 ? 'scaleX(-1)' : 'none';

  const fImg = turnerEl.querySelector('.flat .mirror img');
  const bImg = turnerEl.querySelector('.flap .mirror img');
  const sf = src(flatPage), sb = src(flapPage);
  fImg.style.display = sf ? '' : 'none'; if (sf && fImg.getAttribute('src')!==sf) fImg.src = sf;
  bImg.style.display = sb ? '' : 'none'; if (sb && bImg.getAttribute('src')!==sb) bImg.src = sb;
  // Each flip reverses handedness. Forward: content mirror + fold reflection =
  // two flips, so the flap reads correctly. Backward already carries the
  // turner's own scaleX(-1), so a third flip would leave the text reversed —
  // drop the content mirror in that direction.
  const flipM = `matrix(-1,0,0,1,${paneW},0)`;
  turnerEl.querySelector('.flap .mirror').style.transform = dir > 0 ? flipM : 'none';
  // The flat part is the sheet seen face-on, so it must read normally. Turning
  // back, the whole rig carries scaleX(-1), so the flat layer needs its own
  // flip to cancel it — otherwise the page that has not moved appears mirrored.
  turnerEl.querySelector('.flat .mirror').style.transform = dir > 0 ? 'none' : flipM;

  underEl.style.display = '';
  underEl.className = 'pane under ' + ((mode==='spread' && dir>0) ? 'right' : 'left');
  underEl.style.width = mode==='spread' ? '50%' : '100%';
  setPage(underEl, underPage(dir));

  // The resting pane for this sheet must go away while the sheet is in motion.
  // Leaving it up puts identical artwork directly beneath the turner, so
  // clipping the flat layer just reveals the same page and the fold is
  // invisible — the sheet looks like it never moved.
  if (mode === 'spread' && dir < 0) paneL.style.display = 'none';
  else paneR.style.display = 'none';
}

function applyFold(P){
  const cy = curEdge === 'top' ? 0 : H;
  geo = foldGeometry(P, {x:paneW,y:cy}, {x:0,y:cy}, paneW, H);
  const flap = turnerEl.querySelector('.flap');
  const cast = turnerEl.querySelector('.cast');
  turnerEl.querySelector('.flat').style.clipPath = geo.flatClip;
  flap.style.clipPath = geo.flapClip;
  flap.style.transform = geo.matrix;
  flap.style.setProperty('--sheen-angle',(geo.foldAngle*180/Math.PI+90).toFixed(1)+'deg');
  cast.style.clipPath = geo.flapClip;
  cast.style.transform = geo.matrix;
  cast.style.opacity = Math.min(.5, geo.progress*1.5);
}

function disarm(){
  turnerEl.style.display = 'none';
  underEl.style.display = 'none';
  // Re-derive pane visibility from state; hardcoding it here would resurrect
  // the blank pane beside a cover.
  render();
}

function toLocal(ev){
  const r = turnerEl.getBoundingClientRect();
  let x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (curDir < 0) x = r.width - x;
  return { x, y };
}

function onGrab(ev){
  const dir = +ev.currentTarget.dataset.dir, edge = ev.currentTarget.dataset.edge;
  if (busy || (dir>0 ? idx>=LAST() : idx<=0)) return;
  const el0 = ev.currentTarget;
  el0.setPointerCapture(ev.pointerId);
  dragged = false;
  armTurner(dir, edge);
  applyFold({x: paneW-1, y: edge==='top' ? 0 : H});

  const move = e => { dragged = true; applyFold(toLocal(e)); };
  const up = () => {
    el0.removeEventListener('pointermove', move);
    el0.removeEventListener('pointerup', up);
    el0.removeEventListener('pointercancel', up);
    if (!dragged){ disarm(); return; }
    settle(geo.progress > 0.5);
    setTimeout(()=>{ dragged = false; }, 0);
  };
  el0.addEventListener('pointermove', move);
  el0.addEventListener('pointerup', up);
  el0.addEventListener('pointercancel', up);
}

function settle(complete){
  busy = true;
  const cy = curEdge==='top' ? 0 : H;
  const from = {...geo.P};
  const to = complete ? {x:-paneW, y:cy} : {x:paneW-1, y:cy};
  const DUR = complete ? 420 : 300, t0 = performance.now();
  const tok = ++animToken;
  (function step(now){
    if (tok !== animToken) return;
    const k = Math.min(1,(now-t0)/DUR), e = 1-Math.pow(1-k,3);
    applyFold({x: from.x+(to.x-from.x)*e, y: from.y+(to.y-from.y)*e});
    if (k<1) requestAnimationFrame(step);
    else { if (complete) idx += curDir; disarm(); render(); busy=false; syncHash(); markRail(); }
  })(t0);
}

/* click / keyboard run the same peel, with a slight arc so it reads as paper
   rather than a plate sliding across */
function go(dir){
  if (busy || (dir>0 ? idx>=LAST() : idx<=0)) return;
  busy = true;
  armTurner(dir, 'top');
  const DUR = 760, t0 = performance.now();
  const tok = ++animToken;
  (function step(now){
    if (tok !== animToken) return;
    const k = Math.min(1,(now-t0)/DUR);
    const e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    applyFold({x: paneW - e*2*paneW, y: Math.sin(e*Math.PI)*H*0.16});
    if (k<1) requestAnimationFrame(step);
    else { idx += dir; disarm(); render(); busy=false; syncHash(); markRail(); }
  })(t0);
}

/* ----------------------------------------------------------------- wiring */
document.getElementById('next').addEventListener('click',()=>go(1));
document.getElementById('prev').addEventListener('click',()=>go(-1));
addEventListener('keydown', e=>{
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='ArrowRight'){ e.preventDefault(); go(1); return; }
  if (e.key==='ArrowLeft'){ e.preventDefault(); go(-1); return; }
  if (e.key==='Home' || e.key==='Escape'){
    e.preventDefault(); jumpToPage(0); toast('Front cover'); return;
  }
  if (e.key==='End'){ e.preventDefault(); jumpToPage(PAGES-1); return; }
  if (/^[a-zA-Z]$/.test(e.key)){
    const L = e.key.toUpperCase();
    if (jumpToLetter(L)) e.preventDefault();
    else toast(`No ${L} pages`);
  }
});

/* ------------------------------------------------------------ letter jumps */
const toastEl = () => document.getElementById('toast');
let toastTimer = null;

function toast(msg){
  const t = toastEl();
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* Page index -> the leaf that displays it.
   A spread shows left = 2*idx - 1 and right = 2*idx, so an odd page index maps
   to ceil(p/2), not floor: with floor, every letter starting on an odd page
   (F, G, H, R, S) landed one spread too far. */
const leafFor = p => mode === 'spread'
  ? Math.min(LAST(), Math.ceil(p / 2))
  : Math.min(LAST(), p);

function jumpToPage(p){
  // Abandon any turn in progress. Dropping the jump instead means a child
  // pressing keys quickly gets silently ignored.
  animToken++;
  busy = false;
  disarm();
  idx = leafFor(p);
  render();
  syncHash();
  markRail();
}

/* Repeating a letter walks through that letter's pages, so pressing S three
   times visits all three S pages rather than sticking on the first. */
function jumpToLetter(L){
  const pages = LETTER_PAGES[L];
  if (!pages || !pages.length) return false;
  // Two consecutive pages of one letter can share a spread, so cycle over
  // distinct leaves or a second press appears to do nothing.
  const leaves = [...new Set(pages.map(leafFor))];
  const here = leaves.indexOf(idx);
  const next = leaves[(here + 1) % leaves.length];
  jumpToPage(next * (mode === 'spread' ? 2 : 1));
  idx = next; render(); syncHash(); markRail();
  toast(leaves.length > 1
    ? `${L} — ${leaves.indexOf(next) + 1} of ${leaves.length}`
    : L);
  return true;
}

function buildRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';

  const home = document.createElement('button');
  home.className = 'home';
  home.textContent = 'Cover';
  home.setAttribute('aria-label', 'Back to the front cover');
  home.addEventListener('click', ()=>{ jumpToPage(0); toast('Front cover'); });
  rail.appendChild(home);

  for (const L of Object.keys(LETTER_PAGES).sort()){
    const b = document.createElement('button');
    b.textContent = L;
    b.dataset.letter = L;
    b.setAttribute('aria-label', `Jump to letter ${L}`);
    b.addEventListener('click', ()=>jumpToLetter(L));
    rail.appendChild(b);
  }
}

function markRail(){
  for (const b of document.querySelectorAll('.rail button')){
    const pages = LETTER_PAGES[b.dataset.letter] || [];
    b.setAttribute('aria-current',
      pages.some(p => leafFor(p) === idx) ? 'true' : 'false');
  }
}

function fromHash(){
  const mL=/letter=([A-Za-z])/.exec(location.hash);
  if (mL){
    const pages = LETTER_PAGES[mL[1].toUpperCase()];
    if (pages && pages.length) return leafFor(pages[0]);
  }
  const m=/page=(\d+)/.exec(location.hash); if(!m) return 0;
  const p=Math.min(PAGES,Math.max(1,parseInt(m[1],10)));
  return mode==='spread' ? Math.min(LAST(),Math.floor(p/2)) : Math.min(LAST(),p-1);
}
function syncHash(){
  const p = mode==='spread' ? (idx===0?1:Math.min(PAGES,idx*2)) : idx+1;
  history.replaceState(null,'',`#page=${p}`);
}
addEventListener('hashchange',()=>{ idx=fromHash(); render(); });

function resize(){
  const AR = 11/8.5;
  const want = innerWidth < SPREAD_MIN ? 'single' : 'spread';
  if (want !== mode){
    const page = mode==='' ? null : (mode==='spread' ? idx*2 : idx);
    mode = want;
    book.classList.toggle('single', mode==='single');
    if (page !== null) idx = Math.min(LAST(), mode==='spread' ? Math.floor(page/2) : page);
  }
  const panes = mode==='spread' ? 2 : 1;
  const chrome = document.querySelector('.masthead').offsetHeight
               + document.querySelector('.controls').offsetHeight
               + document.querySelector('.tip').offsetHeight + 96;
  const availW = Math.min(innerWidth-40,1680), availH = innerHeight-chrome;
  let pw = availW/panes, ph = pw/AR;
  if (ph > availH){ ph = availH; pw = ph*AR; }
  paneW = pw; W = pw*panes; H = ph;
  book.style.width = W+'px';
  book.style.height = H+'px';
}
addEventListener('resize', ()=>{ resize(); render(); });

buildSkeleton();
buildRail();
resize();
idx = fromHash();
book.style.transition = 'none';      // no slide-in on first paint
render();
markRail();
requestAnimationFrame(() => { book.style.transition = ''; });

// exposed for the screenshot harness (explicit accessors: Object.assign would
// copy getter values rather than the accessors themselves)
window.FB = {
  go, render, applyFold, armTurner, disarm, LAST,
  get idx(){ return idx; }, set idx(v){ idx = v; },
  get mode(){ return mode; }, get paneW(){ return paneW; }, get H(){ return H; }
};
</script>

</body>
</html>
